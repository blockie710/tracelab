name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pillow
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark smoke test
        run: |
          tracelab demo --out /tmp/index.html
          python - <<'PY'
          import json, sys
          r = json.load(open("/tmp/index.json"))
          auc = r["metrics"]["auc"]
          print(f"AUC={auc:.4f} recall@1%FPR={r['metrics']['tpr_at_1pct_fpr']:.3f}")
          sys.exit(0 if auc > 0.95 else 1)
          PY
